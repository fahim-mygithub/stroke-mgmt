# Builds an UNSIGNED iOS IPA for sideloading (Sideloadly, AltStore, etc.).
# No Apple Developer account or signing certificates are needed here — the
# sideloading tool re-signs the IPA with the tester's own Apple ID.
#
# Trigger manually: Actions tab → "iOS sideload build" → Run workflow,
# or `gh workflow run ios-sideload-build.yml --ref <branch>`.
# The IPA is uploaded as a workflow artifact.
name: iOS sideload build

on:
  workflow_dispatch:
  # workflow_dispatch only works once the workflow exists on the default
  # branch; until then, touching this file (e.g. bumping the comment below)
  # and pushing re-triggers a build on this branch.
  push:
    branches: [app-store-readiness-blockers]
    paths: ['.github/workflows/ios-sideload-build.yml']

# build-trigger: 12

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # SDK 56's expo-modules-jsi declares swift-tools-version 6.2, which needs
      # Xcode 26.x (runner default is 16.4 / Swift 6.1). Stay below 26.5 —
      # its SwiftPM scheme resolution breaks this same build phase
      # (expo/expo#46326). The build-xcframework script forwards DEVELOPER_DIR
      # into its nested xcodebuild.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: '1'
          # Leave NODE_ENV unset/production so extra.NODE_ENV routes the app
          # at the live CMS, matching a store build.

      - name: Install CocoaPods
        run: pod install --project-directory=ios

      - name: Toolchain diagnostics
        run: |
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep -i '^Xcode' || true

      # expo-modules-jsi's pod script phase builds a local SwiftPM package with
      # a nested `xcodebuild -disableAutomaticPackageResolution`, which fails
      # with "Could not resolve package dependencies:" when no resolved
      # workspace state exists yet (fresh CI checkout). Resolve it up front.
      - name: Pre-resolve ExpoModulesJSI SwiftPM state
        run: |
          cd node_modules/expo-modules-jsi/apple
          xcodebuild -resolvePackageDependencies \
            -scheme ExpoModulesJSI \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .DerivedData

      - name: Build unsigned archive
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme '$SCHEME' from '$WORKSPACE'"
          mkdir -p build
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild-raw.log | xcbeautify --renderer github-actions

      - name: Upload raw xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-raw-log
          path: build/xcodebuild-raw.log
          retention-days: 7

      - name: Package IPA
        run: |
          VERSION=$(node -p "require('./app.config.js').expo.version")
          mkdir -p build/Payload
          cp -R build/app.xcarchive/Products/Applications/*.app build/Payload/
          (cd build && zip -qry "IschemicStroke-${VERSION}-unsigned.ipa" Payload)
          ls -lh build/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-sideload-ipa
          path: build/*.ipa
          retention-days: 30
